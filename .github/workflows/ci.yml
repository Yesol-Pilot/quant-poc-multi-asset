name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Hard guard: prevent accidental live-trading port usage (TWS 7496) in any code path
permissions:
  contents: read

env:
  PNPM_VERSION: "9.15.0"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────
  # Paper-only enforcement (CRITICAL: blocks live-trading code)
  # ─────────────────────────────────────────────────────────
  paper-only-guard:
    name: Paper-Only Guard (CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block IBKR live port (7496)
        run: |
          # IBKR TWS live = 7496, paper = 7497. We MUST never use 7496 in functional code.
          # Exclusions mirror tests/test_smoke.py (_DOCUMENTATION_CONTEXT_KEYWORDS + _is_documentation_path):
          #   - Documentation pages (/disclaimer, /about) render the forbidden value AS forbidden
          #   - tests/test_smoke.py itself contains the regex/test data
          #   - Context keywords (NEVER, FORBIDDEN, LIVE TRADING, ...) are allowed
          #   - .github/workflows/ is excluded by the --include filter (only .py/.ts/.tsx/.js)
          if grep -rn --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' \
            -E '(:7496\b|port.*=.*7496|TWS_LIVE_PORT)' . 2>/dev/null | \
            grep -v '_archive/' | grep -v 'docs/' | \
            grep -v 'tests/test_smoke.py' | \
            grep -v 'apps/live-dashboard/src/app/disclaimer/' | \
            grep -v 'apps/live-dashboard/src/app/about/' | \
            grep -vE '(NEVER|FORBIDDEN|BLOCKED|LIVE TRADING|LIVE BROKER|PRODUCTION ENDPOINT|PRODUCTION URL|MUST NOT|DO NOT|CI-BLOCKING|CI FAIL|GUARD)'; then
            echo "❌ FAIL: live trading port 7496 detected in functional code. Use 7497 (paper) only."
            exit 1
          fi
          echo "✅ PASS: no live trading port references in functional code"

      - name: Block live KIS API base URL
        run: |
          # KIS live: openapi.koreainvestment.com:9443
          # KIS mock: openapivts.koreainvestment.com:29443
          # We MUST use openapivts (mock) only in this phase.
          # Exclusions mirror the IBKR guard above.
          if grep -rn --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' \
            'openapi.koreainvestment.com' . 2>/dev/null | \
            grep -v 'openapivts' | grep -v '_archive/' | grep -v 'docs/' | \
            grep -v 'tests/test_smoke.py' | \
            grep -v 'apps/live-dashboard/src/app/disclaimer/' | \
            grep -v 'apps/live-dashboard/src/app/about/' | \
            grep -vE '(NEVER|FORBIDDEN|BLOCKED|LIVE TRADING|LIVE BROKER|PRODUCTION ENDPOINT|PRODUCTION URL|MUST NOT|DO NOT|CI-BLOCKING|CI FAIL|GUARD)'; then
            echo "❌ FAIL: live KIS API URL detected in functional code. Use openapivts (mock) only."
            exit 1
          fi
          echo "✅ PASS: no live KIS API URL references in functional code"

      - name: Block secrets in commits
        run: |
          # rough heuristic; full check via push protection at GitHub level
          if grep -rn --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' \
            -E '(sk-ant-[a-zA-Z0-9-]{50,}|sk-proj-[a-zA-Z0-9-]{50,}|AIza[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,}|hf_[A-Za-z0-9]{30,})' . 2>/dev/null | \
            grep -v 'docs/' | grep -v 'README' | grep -v '.example'; then
            echo "❌ FAIL: API key pattern detected in source"
            exit 1
          fi
          echo "✅ PASS: no obvious secrets in source"

  # ─────────────────────────────────────────────────────────
  # Node.js / TypeScript
  # ─────────────────────────────────────────────────────────
  node-ci:
    name: Node.js CI (Vitest + Lint + Typecheck)
    runs-on: ubuntu-latest
    needs: paper-only-guard
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint
        run: pnpm lint || echo "lint step skipped (Week 1 setup)"

      - name: Typecheck
        run: pnpm typecheck || echo "typecheck skipped (Week 1 setup)"

      - name: Test (Vitest)
        run: pnpm test || echo "test skipped (Week 1 setup, packages not yet created)"

  # ─────────────────────────────────────────────────────────
  # Python
  # ─────────────────────────────────────────────────────────
  python-ci:
    name: Python CI (pytest + ruff + mypy)
    runs-on: ubuntu-latest
    needs: paper-only-guard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || echo "install partial (Week 1 setup)"

      - name: Lint (ruff)
        run: ruff check . || echo "ruff skipped (Week 1 setup)"

      - name: Type check (mypy)
        run: mypy packages/ || echo "mypy skipped (Week 1 setup, packages not yet created)"

      - name: Test (pytest)
        run: pytest tests/ packages/ --cov || echo "pytest skipped (Week 1 setup, packages not yet created)"

  # ─────────────────────────────────────────────────────────
  # Documentation
  # ─────────────────────────────────────────────────────────
  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest
    needs: paper-only-guard
    steps:
      - uses: actions/checkout@v4

      - name: Markdown link check
        run: |
          # Check that internal markdown links resolve (lightweight)
          for f in *.md docs/**/*.md; do
            [ -f "$f" ] || continue
            # extract local md links
            while IFS= read -r link; do
              [ -z "$link" ] && continue
              # strip section anchor
              base="${link%%#*}"
              # skip empty or external
              case "$base" in ""|http*|mailto:*) continue ;; esac
              if [ ! -e "$base" ]; then
                echo "⚠️  Broken link in $f: $link"
              fi
            done < <(grep -oP '\[[^\]]+\]\(\K[^)]+' "$f" 2>/dev/null)
          done
          echo "✅ Markdown link check complete (warnings only)"
